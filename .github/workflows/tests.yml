name: tests

on:
  push:
  pull_request:

jobs:
  quant-advisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install packages
        run: Rscript protease-quant-advisor/install.R

      - name: Every R file parses
        run: |
          Rscript -e 'f <- list.files(".", "[.]R$", recursive = TRUE); for (x in f) invisible(parse(x)); cat(length(f), "R files parse\n")'

      - name: Test suite (synthetic data; real-data tests skip)
        run: Rscript protease-quant-advisor/tests/run_all_tests.R
